<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc">
<title id="title">关键时序图</title><desc id="desc">软件开发中等复杂度示例；仅用于模板学习，不代表已确认方案。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>

<style>
text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:18px;fill:#25313A}
.box{fill:white;stroke:#52616D;stroke-width:1.4}
.line{fill:none;stroke:#52616D;stroke-width:1.6}
.dashed{stroke-dasharray:6 5}.small{font-size:14px}.heading{font-size:26px;font-weight:600}
.panel{fill:#F5F7FA;stroke:#CBD5DF;stroke-width:1}
.guide{fill:none;stroke:#CBD5DF;stroke-width:1}
.blue{stroke:#426B91}.purple{stroke:#786783}.teal{stroke:#477C80}.brown{stroke:#8A735C}
.green{stroke:#327354}.red{stroke:#AA4E4E}.yellow{stroke:#926D20}
.box.green{fill:#EDF5EF}.box.red{fill:#FAEEEE}.box.yellow{fill:#FBF5E5}
.caption{paint-order:stroke;stroke:white;stroke-width:7px;stroke-linejoin:round}
</style>
<rect width="1280" height="850" fill="white"/>

<text x="40" y="48" class="heading">关键时序图</text>
<rect x="40" y="120" width="160" height="45" class="box"/><text x="120" y="148.5" text-anchor="middle">浏览器</text><path d="M120 165 V770" class="guide dashed"/><rect x="300" y="120" width="160" height="45" class="box"/><text x="380" y="148.5" text-anchor="middle">聊天服务</text><path d="M380 165 V770" class="guide dashed"/><rect x="570" y="120" width="160" height="45" class="box"/><text x="650" y="148.5" text-anchor="middle">模型网关</text><path d="M650 165 V770" class="guide dashed"/><rect x="820" y="120" width="160" height="45" class="box"/><text x="900" y="148.5" text-anchor="middle">用量接收</text><path d="M900 165 V770" class="guide dashed"/><rect x="1080" y="120" width="160" height="45" class="box"/><text x="1160" y="148.5" text-anchor="middle">钱包服务</text><path d="M1160 165 V770" class="guide dashed"/><path d="M120 210 H380" class="line blue" marker-end="url(#arrow)"/><text x="250" y="195" class="small" text-anchor="middle">发送消息</text><path d="M380 250 H650" class="line blue" marker-end="url(#arrow)"/><text x="515" y="235" class="small" text-anchor="middle">鉴权并调用</text><rect x="55" y="280" width="665" height="260" fill="none" stroke="#CBD5DF"/><text x="65" y="306" class="small">alt</text><text x="420" y="306" class="small" text-anchor="middle">[调用获准]</text><path d="M650 350 H380" class="line purple dashed" marker-end="url(#arrow)"/><text x="515" y="335" class="small" text-anchor="middle">内容流</text><path d="M380 390 H120" class="line purple dashed" marker-end="url(#arrow)"/><text x="250" y="375" class="small" text-anchor="middle">展示内容</text><path d="M55 425 H720" class="guide dashed"/><text x="423" y="451" class="small" text-anchor="middle">[拒绝或失败]</text><path d="M650 485 H380" class="line purple dashed" marker-end="url(#arrow)"/><text x="515" y="471" class="small" text-anchor="middle">错误信息</text><path d="M380 520 H120" class="line purple dashed" marker-end="url(#arrow)"/><path d="M650 595 H900" class="line teal" marker-end="url(#arrow)"/><text x="775" y="579" class="small" text-anchor="middle">异步用量事件</text><path d="M900 640 H1160" class="line teal" marker-end="url(#arrow)"/><text x="1030" y="624" class="small" text-anchor="middle">幂等扣款</text><path d="M1160 682 H900" class="line teal dashed" marker-end="url(#arrow)"/><text x="1030" y="669" class="small" text-anchor="middle">结算结果</text><path d="M120 730 H900" class="line blue" marker-end="url(#arrow)"/><text x="510" y="716" class="small" text-anchor="middle">稍后查询本人结算状态</text><path d="M900 765 H120" class="line purple dashed" marker-end="url(#arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc">
<title id="title">状态图</title><desc id="desc">软件开发中等复杂度示例；仅用于模板学习，不代表已确认方案。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>

<style>
text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:18px;fill:#25313A}
.box{fill:white;stroke:#52616D;stroke-width:1.4}
.line{fill:none;stroke:#52616D;stroke-width:1.6}
.dashed{stroke-dasharray:6 5}.small{font-size:14px}.heading{font-size:26px;font-weight:600}
.panel{fill:#F5F7FA;stroke:#CBD5DF;stroke-width:1}
.guide{fill:none;stroke:#CBD5DF;stroke-width:1}
.blue{stroke:#426B91}.purple{stroke:#786783}.teal{stroke:#477C80}.brown{stroke:#8A735C}
.green{stroke:#327354}.red{stroke:#AA4E4E}.yellow{stroke:#926D20}
.box.green{fill:#EDF5EF}.box.red{fill:#FAEEEE}.box.yellow{fill:#FBF5E5}
.caption{paint-order:stroke;stroke:white;stroke-width:7px;stroke-linejoin:round}
</style>
<rect width="1280" height="850" fill="white"/>
<text x="40" y="48" class="heading">状态图</text>

<circle cx="70" cy="205" r="8" fill="#25313A"/>
<rect x="130" y="175" width="190" height="76" class="box"/>
<text x="225" y="219" text-anchor="middle">待发送</text>
<rect x="500" y="175" width="190" height="76" class="box"/>
<text x="595" y="219" text-anchor="middle">校验中</text>
<rect x="940" y="175" width="190" height="76" class="box"/>
<text x="1035" y="219" text-anchor="middle">生成中</text>
<path d="M78 205 H130" class="line blue" marker-end="url(#arrow)"/>
<path d="M320 205 H500" class="line blue" marker-end="url(#arrow)"/>
<text x="410" y="191" class="small" text-anchor="middle">发送</text>
<path d="M500 223 H320" class="line purple" marker-end="url(#arrow)"/>
<text x="410" y="246" class="small" text-anchor="middle">失败重试</text>
<path d="M690 205 H940" class="line blue" marker-end="url(#arrow)"/>
<text x="815" y="191" class="small" text-anchor="middle">校验通过</text>
<path d="M940 223 H690" class="line purple" marker-end="url(#arrow)"/>
<text x="815" y="246" class="small" text-anchor="middle">失败重试 [用户主动发起]</text>
<rect x="940" y="400" width="190" height="60" class="box green"/>
<text x="1035" y="436" text-anchor="middle">已完成</text>
<path d="M1035 251 V400" class="line blue" marker-end="url(#arrow)"/>
<text x="1090" y="327" class="small" text-anchor="middle">正常结束</text>
<rect x="940" y="650" width="190" height="60" class="box yellow"/>
<text x="1035" y="686" text-anchor="middle">停止中</text>
<rect x="500" y="650" width="190" height="60" class="box"/>
<text x="595" y="686" text-anchor="middle">已停止</text>
<path d="M1130 213 H1190 V680 H1130" class="line blue" marker-end="url(#arrow)"/>
<text x="1130" y="545" class="small" text-anchor="middle">停止请求</text>
<path d="M940 680 H690" class="line blue" marker-end="url(#arrow)"/>
<text x="815" y="665" class="small" text-anchor="middle">停止确认</text>
<path d="M500 680 L245 251" class="line blue" marker-end="url(#arrow)"/>
<text x="380" y="505" class="small" text-anchor="middle">新一次发送</text>
</svg>

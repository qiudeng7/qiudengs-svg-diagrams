<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc">
<title id="title">页面线框图</title><desc id="desc">软件开发中等复杂度示例；仅用于模板学习，不代表已确认方案。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>

<style>
text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:18px;fill:#25313A}
.box{fill:white;stroke:#52616D;stroke-width:1.4}
.line{fill:none;stroke:#52616D;stroke-width:1.6}
.dashed{stroke-dasharray:6 5}.small{font-size:14px}.heading{font-size:26px;font-weight:600}
.panel{fill:#F5F7FA;stroke:#CBD5DF;stroke-width:1}
.guide{fill:none;stroke:#CBD5DF;stroke-width:1}
.blue{stroke:#426B91}.purple{stroke:#786783}.teal{stroke:#477C80}.brown{stroke:#8A735C}
.green{stroke:#327354}.red{stroke:#AA4E4E}.yellow{stroke:#926D20}
.box.green{fill:#EDF5EF}.box.red{fill:#FAEEEE}.box.yellow{fill:#FBF5E5}
.caption{paint-order:stroke;stroke:white;stroke-width:7px;stroke-linejoin:round}
</style>
<rect width="1280" height="850" fill="white"/>
<text x="40" y="48" class="heading">页面线框图</text>
<rect x="40" y="120" width="1190" height="635" class="box"/><path d="M255 120 V755 M255 200 H1230" class="guide"/><text x="63" y="157" >用户控制台</text><text x="67" y="235" >模型广场</text><rect x="55" y="265" width="185" height="43" class="box blue"/><text x="147.5" y="292.5" text-anchor="middle">聊天试用</text><text x="67" y="355" >费用账单</text><text x="67" y="405" >API Keys</text><rect x="285" y="145" width="300" height="38" class="box"/><text x="435" y="170" text-anchor="middle">模型 A</text><path d="M555 159 L565 169 L575 159" class="line"/><text x="760" y="170" class="small" text-anchor="middle">输入 ¥ X / 百万 Token</text><text x="1075" y="170" class="small" text-anchor="middle">账户余额 ¥ 12.00</text><rect x="285" y="225" width="900" height="48" class="panel"/><text x="305" y="255" class="small">① 切换模型会保留文字上下文；历史内容可能再次产生输入费用。</text><rect x="285" y="300" width="620" height="75" class="box blue"/><text x="305" y="328" class="small">用户</text><text x="305" y="355" class="small">请说明这两种方案的差异。</text><rect x="410" y="398" width="775" height="140" class="box purple"/><text x="430" y="426" class="small">模型 A</text><text x="430" y="464" >这里展示流式回答内容……</text><text x="430" y="512" class="small">② 生成已结束  ·  费用待结算（未确认）</text><rect x="285" y="557" width="150" height="35" class="box"/><text x="360" y="580.5" text-anchor="middle">新建对话</text><rect x="1030" y="557" width="155" height="35" class="box"/><text x="1107.5" y="580.5" text-anchor="middle">停止生成</text><rect x="285" y="610" width="710" height="72" class="box"/><text x="305" y="650" class="small">输入消息……</text><rect x="1020" y="610" width="165" height="72" class="box blue"/><text x="1102.5" y="652" text-anchor="middle">发送</text><text x="285" y="720" class="small">③ 前后端不持久保存会话正文；当前页面保留上下文。</text>
</svg>

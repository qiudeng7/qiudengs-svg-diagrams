<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
  <title id="title">正例：共享依赖居中，专属依赖靠近</title>
  <desc id="desc">组件布局示例；文字说明见绘图规则文档。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#426B91" />
    </marker>
  </defs>
  <style>text{font-family:Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Source Han Sans CN', sans-serif;font-size:18px;fill:#25313A}.heading{font-size:26px;font-weight:600}.small{font-size:14px}.box{fill:white;stroke:#426B91;stroke-width:1.4}.panel{fill:#F5F7FA;stroke:#CBD5DF}.label{fill:#E9EEF3;stroke:#CBD5DF}.edge{fill:none;stroke:#426B91;stroke-width:1.6}</style>
  <rect width="1280" height="500" fill="white" />
  <text x="40" y="48" class="heading" font-size="26px" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Source Han Sans CN', sans-serif" fill="#25313A" font-weight="600">正例：共享依赖居中，专属依赖靠近</text>
  <rect x="270" y="130" width="240" height="65" class="box" fill="white" stroke="#426B91" stroke-width="1.4" />
  <text x="390" y="168.5" text-anchor="middle" font-size="18px" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Source Han Sans CN', sans-serif" fill="#25313A">用户模型目录</text>
  <rect x="730" y="130" width="240" height="65" class="box" fill="white" stroke="#426B91" stroke-width="1.4" />
  <text x="850" y="168.5" text-anchor="middle" font-size="18px" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Source Han Sans CN', sans-serif" fill="#25313A">聊天请求入口</text>
  <rect x="60" y="350" width="200" height="65" class="box" fill="white" stroke="#426B91" stroke-width="1.4" />
  <text x="160" y="388.5" text-anchor="middle" font-size="18px" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Source Han Sans CN', sans-serif" fill="#25313A">模型配置</text>
  <rect x="520" y="350" width="200" height="65" class="box" fill="white" stroke="#426B91" stroke-width="1.4" />
  <text x="620" y="388.5" text-anchor="middle" font-size="18px" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Source Han Sans CN', sans-serif" fill="#25313A">身份 / 权限</text>
  <rect x="980" y="350" width="200" height="65" class="box" fill="white" stroke="#426B91" stroke-width="1.4" />
  <text x="1080" y="388.5" text-anchor="middle" font-size="18px" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Source Han Sans CN', sans-serif" fill="#25313A">网关适配</text>
  <path d="M365 195 L160 350" class="edge" marker-end="url(#arrow)" fill="none" stroke="#426B91" stroke-width="1.6" />
  <path d="M415 195 L620 350" class="edge" marker-end="url(#arrow)" fill="none" stroke="#426B91" stroke-width="1.6" />
  <path d="M825 195 L620 350" class="edge" marker-end="url(#arrow)" fill="none" stroke="#426B91" stroke-width="1.6" />
  <path d="M875 195 L1080 350" class="edge" marker-end="url(#arrow)" fill="none" stroke="#426B91" stroke-width="1.6" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc">
  <title id="title">反例：将短重试回环展开为三角形</title>
  <desc id="desc">软件开发中等复杂度示例；仅用于模板学习，不代表已确认方案。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#52616d" />
    </marker>
  </defs>
  <style>
text{font-family:Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Source Han Sans CN', sans-serif;font-size:18px;fill:#25313A}
.box{fill:white;stroke:#52616D;stroke-width:1.4}
.line{fill:none;stroke:#52616D;stroke-width:1.6}
.dashed{stroke-dasharray:6 5}.small{font-size:14px}.heading{font-size:26px;font-weight:600}
.panel{fill:#F5F7FA;stroke:#CBD5DF;stroke-width:1}
.guide{fill:none;stroke:#CBD5DF;stroke-width:1}
.blue{stroke:#426B91}.purple{stroke:#786783}.teal{stroke:#477C80}.brown{stroke:#8A735C}
.green{stroke:#327354}.red{stroke:#AA4E4E}.yellow{stroke:#926D20}
.box.green{fill:#EDF5EF}.box.red{fill:#FAEEEE}.box.yellow{fill:#FBF5E5}
.caption{paint-order:stroke;stroke:white;stroke-width:7px;stroke-linejoin:round}
</style>
  <rect width="1280" height="850" fill="white" />
  <text x="40" y="48" class="heading" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Source Han Sans CN', sans-serif" font-size="26px" fill="#25313A" font-weight="600">反例：多余失败节点形成尖锐三角回环</text>
  <circle cx="70" cy="205" r="8" fill="#111" />
  <rect x="130" y="175" width="190" height="60" class="box" fill="white" stroke="#52616D" stroke-width="1.4" />
  <text x="225" y="211" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Source Han Sans CN', sans-serif" font-size="18px" fill="#25313A">待发送</text>
  <rect x="470" y="175" width="190" height="60" class="box" fill="white" stroke="#52616D" stroke-width="1.4" />
  <text x="565" y="211" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Source Han Sans CN', sans-serif" font-size="18px" fill="#25313A">校验中</text>
  <rect x="910" y="175" width="190" height="60" class="box" fill="white" stroke="#52616D" stroke-width="1.4" />
  <text x="1005" y="211" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Source Han Sans CN', sans-serif" font-size="18px" fill="#25313A">生成中</text>
  <rect x="130" y="400" width="190" height="60" class="box red" fill="#FAEEEE" stroke="#AA4E4E" stroke-width="1.4" />
  <text x="225" y="436" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Source Han Sans CN', sans-serif" font-size="18px" fill="#25313A">校验失败</text>
  <rect x="470" y="400" width="190" height="60" class="box red" fill="#FAEEEE" stroke="#AA4E4E" stroke-width="1.4" />
  <text x="565" y="436" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Source Han Sans CN', sans-serif" font-size="18px" fill="#25313A">请求失败</text>
  <rect x="910" y="400" width="190" height="60" class="box green" fill="#EDF5EF" stroke="#327354" stroke-width="1.4" />
  <text x="1005" y="436" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Source Han Sans CN', sans-serif" font-size="18px" fill="#25313A">已完成</text>
  <rect x="470" y="650" width="190" height="60" class="box" fill="white" stroke="#52616D" stroke-width="1.4" />
  <text x="565" y="686" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Source Han Sans CN', sans-serif" font-size="18px" fill="#25313A">已停止</text>
  <rect x="910" y="650" width="190" height="60" class="box yellow" fill="#FBF5E5" stroke="#926D20" stroke-width="1.4" />
  <text x="1005" y="686" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Source Han Sans CN', sans-serif" font-size="18px" fill="#25313A">停止中</text>
  <path d="M78 205 H130" class="line blue" marker-end="url(#arrow)" fill="none" stroke="#426B91" stroke-width="1.6" />
  <path d="M320 205 H470" class="line blue" marker-end="url(#arrow)" fill="none" stroke="#426B91" stroke-width="1.6" />
  <text x="395" y="186" class="small" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Source Han Sans CN', sans-serif" font-size="14px" fill="#25313A">发送</text>
  <path d="M660 205 H910" class="line blue" marker-end="url(#arrow)" fill="none" stroke="#426B91" stroke-width="1.6" />
  <text x="785" y="186" class="small" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Source Han Sans CN', sans-serif" font-size="14px" fill="#25313A">校验通过</text>
  <path d="M470 225 L320 410" class="line red" marker-end="url(#arrow)" fill="none" stroke="#AA4E4E" stroke-width="1.6" />
  <text x="389" y="306" class="small" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Source Han Sans CN', sans-serif" font-size="14px" fill="#25313A">拒绝</text>
  <path d="M225 400 V235" class="line blue" marker-end="url(#arrow)" fill="none" stroke="#426B91" stroke-width="1.6" />
  <text x="289" y="322" class="small" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Source Han Sans CN', sans-serif" font-size="14px" fill="#25313A">修正后发送</text>
  <path d="M1005 235 V400" class="line blue" marker-end="url(#arrow)" fill="none" stroke="#426B91" stroke-width="1.6" />
  <text x="1070" y="320" class="small" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Source Han Sans CN', sans-serif" font-size="14px" fill="#25313A">正常结束</text>
  <path d="M910 225 L660 410" class="line red" marker-end="url(#arrow)" fill="none" stroke="#AA4E4E" stroke-width="1.6" />
  <text x="784" y="300" class="small" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Source Han Sans CN', sans-serif" font-size="14px" fill="#25313A">上游异常</text>
  <path d="M565 400 V235" class="line blue" marker-end="url(#arrow)" fill="none" stroke="#426B91" stroke-width="1.6" />
  <text x="634" y="322" class="small" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Source Han Sans CN', sans-serif" font-size="14px" fill="#25313A">主动重试</text>
  <path d="M1100 205 H1170 V680 H1100" class="line blue" marker-end="url(#arrow)" fill="none" stroke="#426B91" stroke-width="1.6" />
  <text x="1110" y="550" class="small" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Source Han Sans CN', sans-serif" font-size="14px" fill="#25313A">停止请求</text>
  <path d="M910 680 H660" class="line blue" marker-end="url(#arrow)" fill="none" stroke="#426B91" stroke-width="1.6" />
  <text x="785" y="662" class="small" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Source Han Sans CN', sans-serif" font-size="14px" fill="#25313A">停止确认</text>
  <path d="M470 680 H40 V115 H225 V175" class="line blue" marker-end="url(#arrow)" fill="none" stroke="#426B91" stroke-width="1.6" />
  <text x="212" y="103" class="small" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Source Han Sans CN', sans-serif" font-size="14px" fill="#25313A">新一次发送（从已停止状态开始）</text>
</svg>
